<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Intelligence Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #475569;
      --success: #22c55e;
      --user-bg: #1e3a5f;
      --bot-bg: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header .subtitle { font-size: 12px; color: var(--text-secondary); }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      margin-left: auto;
    }
    .status-text { font-size: 12px; color: var(--text-secondary); }

    /* Chat area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid #2563eb44;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.bot .answer { white-space: pre-wrap; }
    .message .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
    .message.user .label { color: #60a5fa; }
    .message.bot .label { color: #a78bfa; }

    /* Sources collapsible */
    .sources-toggle {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sources-toggle:hover { background: var(--accent); color: #fff; }
    .sources-panel {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #0f172a88;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .sources-panel.open { display: block; }
    .source-item {
      padding: 6px 0;
      border-bottom: 1px solid #334155;
    }
    .source-item:last-child { border-bottom: none; }

    /* Typing indicator */
    .typing { display: none; align-self: flex-start; padding: 14px 18px; }
    .typing.visible { display: flex; }
    .typing span {
      width: 8px; height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
      margin-right: 4px;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); }
      40% { transform: scale(1); }
    }

    /* Input area */
    .input-area {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .company-select {
      padding: 10px 12px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    .input-area input[type="text"]:focus { border-color: var(--accent); }
    .input-area input::placeholder { color: var(--text-secondary); }
    .send-btn {
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .welcome h2 { color: var(--text-primary); margin-bottom: 8px; font-size: 22px; }
    .welcome p { font-size: 14px; max-width: 500px; margin: 0 auto 20px; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .example-btn {
      padding: 8px 14px;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .example-btn:hover { border-color: var(--accent); color: var(--accent); }
    .answer table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
    .answer th, .answer td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    .answer th { background: var(--bg-primary); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">BI</div>
    <div>
      <h1>Business Intelligence Assistant</h1>
      <div class="subtitle">Honda | Toyota | Ford &mdash; 10-K Filings, Financials &amp; Recalls</div>
    </div>
    <div class="status-dot"></div>
    <span class="status-text">Online</span>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="welcome" id="welcome">
      <h2>Ask anything about automotive companies</h2>
      <p>Query financial data, search SEC filings, analyze recalls, or generate reports using AI-powered tools.</p>
      <div class="examples">
        <button class="example-btn" onclick="askExample(this)">What was Honda's revenue in 2023?</button>
        <button class="example-btn" onclick="askExample(this)">Compare R&D spend: Honda vs Toyota</button>
        <button class="example-btn" onclick="askExample(this)">What supply chain risks does Honda report?</button>
        <button class="example-btn" onclick="askExample(this)">List Ford recalls for Escape</button>
      </div>
    </div>
    <div class="message bot typing" id="typing"><span></span><span></span><span></span></div>
  </div>

  <div class="input-area">
    <select class="company-select" id="companySelect">
      <option value="">All Companies</option>
      <option value="HMC">Honda (HMC)</option>
      <option value="TM">Toyota (TM)</option>
      <option value="F">Ford (F)</option>
    </select>
    <input type="text" id="queryInput" placeholder="Ask a question..." autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

<script>
  const chatContainer = document.getElementById('chatContainer');
  const queryInput = document.getElementById('queryInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  const welcome = document.getElementById('welcome');
  const companySelect = document.getElementById('companySelect');

  queryInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });

  function askExample(btn) {
    queryInput.value = btn.textContent;
    sendMessage();
  }

  function addMessage(text, role, sources) {
    if (welcome) welcome.style.display = 'none';
    const div = document.createElement('div');
    div.className = `message ${role}`;

    let html = `<div class="label">${role === 'user' ? 'You' : 'Assistant'}</div>`;
    html += `<div class="answer">${role === 'bot' ? marked.parse(text) : escapeHtml(text)}</div>`;

    if (sources && sources.length > 0) {
      const id = 'src-' + Date.now();
      html += `<button class="sources-toggle" onclick="toggleSources('${id}')">Show Sources (${sources.length})</button>`;
      html += `<div class="sources-panel" id="${id}">`;
      sources.forEach((s, i) => {
        html += `<div class="source-item"><strong>Source ${i+1}:</strong> ${escapeHtml(JSON.stringify(s))}</div>`;
      });
      html += `</div>`;
    }

    div.innerHTML = html;
    chatContainer.insertBefore(div, typing);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function toggleSources(id) {
    document.getElementById(id).classList.toggle('open');
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  async function sendMessage() {
    const query = queryInput.value.trim();
    if (!query) return;

    const company = companySelect.value || null;
    addMessage(query, 'user');
    queryInput.value = '';
    sendBtn.disabled = true;
    typing.classList.add('visible');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, company }),
      });
      const data = await resp.json();
      addMessage(data.answer || 'No response.', 'bot', data.sources || []);
    } catch (err) {
      addMessage('Error: Could not reach the server.', 'bot');
    } finally {
      typing.classList.remove('visible');
      sendBtn.disabled = false;
      queryInput.focus();
    }
  }
</script>

</body>
</html>
