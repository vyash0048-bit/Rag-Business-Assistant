# docker/docker-compose.yml
version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["../qdrant_storage:/qdrant/storage"]
  mcp-server:
    build: { context: .., dockerfile: docker/Dockerfile.backend }
    command: ["python", "-m", "src.mcp.server"]
    ports: ["8001:8001"]
    env_file: ["../.env"]
    volumes: 
      - ../data:/app/data
      - ..:/app
  backend:
    build: { context: .., dockerfile: docker/Dockerfile.backend }
    ports: ["8002:8000"]
    env_file: ["../.env"]
    depends_on: [qdrant, mcp-server]
    volumes: 
      - ../data:/app/data
      - ..:/app
  frontend:
    build: { context: .., dockerfile: docker/Dockerfile.frontend }
    ports: ["8502:8501"]
    depends_on: [backend]
    env_file: ["../.env"]
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ..:/app
